<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=720,height=1280,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="google" content="notranslate">
  <title>Boneco Game Renderer</title>
  <link rel="stylesheet" href="/static/css/renderer.css?v=26">
</head>
<body class="notranslate">
  <div id="stage">
    <canvas id="tunnelCanvas" width="360" height="640" aria-hidden="true"></canvas>
    <div id="skyLayer" class="skyLayer" aria-hidden="true">
      <div class="skyStars"></div>
      <div class="skyClouds"></div>
      <div class="skyOrb"></div>
    </div>
    <div id="world">
      <div id="mapLower"></div>
      <div id="mapBack"></div>
      <div id="actorLayer">
        <div id="actorShadow"></div>
        <div id="robotCharacter" class="robot-character" aria-label="Boneco robô de frente">
          <div class="robot-antenna"><i></i></div>
          <div class="robot-head">
            <div class="robot-ear robot-ear-left"></div><div class="robot-ear robot-ear-right"></div>
            <div class="robot-face">
              <div class="robot-brow"></div>
              <div class="robot-eyes"><i></i><i></i></div>
              <div class="robot-mouth"><i></i></div>
            </div>
            <div class="robot-neck"></div>
          </div>
          <div class="robot-body">
            <div class="robot-shoulder robot-shoulder-left"></div><div class="robot-shoulder robot-shoulder-right"></div>
            <div class="robot-arm robot-arm-left"><div class="robot-forearm"></div><div class="robot-hand"></div></div>
            <div class="robot-arm robot-arm-right"><div class="robot-forearm"></div><div class="robot-hand"></div></div>
            <div class="robot-chest">
              <div class="robot-chest-label">B-01</div><div class="robot-core"></div>
              <div class="robot-status-lights"><i></i><i></i><i></i></div>
              <div class="robot-grille"><i></i><i></i><i></i></div>
            </div>
            <div class="robot-waist"></div>
          </div>
          <div class="robot-legs"><div class="robot-leg robot-leg-left"><div class="robot-knee"></div><div class="robot-foot"></div></div><div class="robot-leg robot-leg-right"><div class="robot-knee"></div><div class="robot-foot"></div></div></div>
          <div class="robot-floor-glow"></div>
        </div>
        <div id="bellyProfile" class="belly-profile" hidden>
          <img id="bellyProfileImage" alt="" hidden>
          <span id="bellyProfileLetter">B</span>
        </div>
        <img id="actorStill" class="actorStill" alt="Personagem parado" hidden>
        <video id="actorVideoA" class="actorVideo active" playsinline muted></video>
        <video id="actorVideoB" class="actorVideo" playsinline muted></video>
      </div>
      <div id="mapFront"></div>
    </div>
    <div id="hud">
      <section id="messageCard" class="message-card" hidden>
        <div id="avatarRing" class="avatar-ring">
          <img id="avatarImage" alt="" hidden>
          <span id="avatarLetter">B</span>
        </div>
        <div class="message-copy">
          <strong id="messageTitle">Boneco</strong>
          <p id="messageText"></p>
        </div>
      </section>

    </div>
    <audio id="sceneAudio" preload="auto"></audio>
    <audio id="musicAudio" preload="auto" loop></audio>
  </div>
  <script src="/static/js/renderer.js?v=56"></script>
</body>
</html>

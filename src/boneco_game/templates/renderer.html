<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=720,height=1280,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="google" content="notranslate">
  <title>Boneco Game Renderer</title>
  <link rel="stylesheet" href="/static/css/renderer.css?v=28">
</head>
<body class="notranslate">
  <div id="stage">
    <canvas id="tunnelCanvas" width="360" height="640" aria-hidden="true"></canvas>
    <div id="skyLayer" class="skyLayer" aria-hidden="true">
      <div class="skyStars"></div>
      <div class="skyClouds"></div>
      <div class="skyOrb"></div>
    </div>
    <div id="world">
      <div id="mapLower"></div>
      <div id="mapBack"></div>
      <div id="actorLayer">
        <div id="actorShadow"></div>
        <div id="bellyProfile" class="belly-profile" hidden>
          <img id="bellyProfileImage" alt="" hidden>
          <span id="bellyProfileLetter">B</span>
        </div>
        <img id="actorStill" class="actorStill" alt="Personagem parado" hidden>
        <video id="actorVideoA" class="actorVideo active" playsinline muted></video>
        <video id="actorVideoB" class="actorVideo" playsinline muted></video>
      </div>
      <div id="mapFront"></div>
    </div>
    <div id="hud">
      <section id="messageCard" class="message-card" hidden>
        <div id="avatarRing" class="avatar-ring">
          <img id="avatarImage" alt="" hidden>
          <span id="avatarLetter">B</span>
        </div>
        <div class="message-copy">
          <strong id="messageTitle">Boneco</strong>
          <p id="messageText"></p>
        </div>
      </section>

    </div>
    <audio id="sceneAudio" preload="auto"></audio>
    <audio id="musicAudio" preload="auto" loop></audio>
  </div>
  <script src="/static/js/renderer.js?v=63"></script>
  <style>
    #bonecoUpdateNotice{position:fixed;z-index:99999;top:12px;right:12px;max-width:min(340px,calc(100vw - 24px));padding:13px 15px;border:1px solid #e6b84a;border-radius:12px;background:#211b12;color:#fff4d2;font:14px/1.4 Arial,sans-serif;box-shadow:0 8px 30px #0008;display:none}
    #bonecoUpdateNotice strong{display:block;margin-bottom:5px}
    #bonecoUpdateNotice a{display:inline-block;margin-top:8px;color:#ffe08a;font-weight:700}
    #bonecoUpdateNotice button{float:right;background:transparent;border:0;color:#fff;font-size:18px;cursor:pointer}
  </style>
  <aside id="bonecoUpdateNotice" role="status" aria-live="polite">
    <button type="button" id="bonecoUpdateClose" aria-label="Fechar">×</button>
    <strong>Atualização disponível!</strong>
    <span id="bonecoUpdateText">Existe uma nova versão do Boneco do Abismo no GitHub.</span>
    <a href="/" target="_blank" rel="noopener">Abrir painel para atualizar</a>
  </aside>
  <script>
    (() => {
      const notice = document.getElementById("bonecoUpdateNotice");
      const text = document.getElementById("bonecoUpdateText");
      const close = document.getElementById("bonecoUpdateClose");
      let alreadyShown = false;
      close.addEventListener("click", () => { notice.style.display = "none"; });
      async function checkForUpdate() {
        try {
          const response = await fetch("/api/system-update/status?fetch_remote=1", {cache:"no-store"});
          const data = await response.json();
          if (data && data.ok && data.update_available && !alreadyShown) {
            alreadyShown = true;
            text.textContent = data.remote_short
              ? "Nova versão " + data.remote_short + " disponível. Abra o painel para instalar."
              : "Existe uma nova versão no GitHub. Abra o painel para instalar.";
            notice.style.display = "block";
          }
        } catch (error) {
          console.warn("Não foi possível verificar atualizações do Boneco:", error);
        }
      }
      window.setTimeout(checkForUpdate, 4000);
      window.setInterval(checkForUpdate, 15 * 60 * 1000);
    })();
  </script>
</body>
</html>
